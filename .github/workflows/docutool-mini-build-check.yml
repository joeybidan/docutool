name: DocuTool Mini build check
on:
  push:
    branches:
      - feature/docutool-mini-collapsed-timezone

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
